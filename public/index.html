<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#21252b">
  <title>Zero Editor</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="overlay"></div>

  <aside id="filetree">
    <div id="filetree-header">
      <span id="dir-path">~</span>
    </div>
    <div id="file-list"></div>
  </aside>

  <div id="app">
    <div id="tabbar"><div id="tab-list"></div></div>

    <main id="editor"></main>

    <footer id="toolbar">
      <button id="btn-tree">☰&nbsp; Filer</button>
      <button id="btn-save">↓&nbsp; Gem</button>
    </footer>
  </div>

  <div id="toast"></div>

  <script src="/editor.bundle.js"></script>
</body>
</html>
